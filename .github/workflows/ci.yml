name: CI

# Vercel handles deployment (build + deploy on every push, preview
# deployments on pull requests) once the repo is connected there — this
# workflow is the quality gate Vercel's own build step doesn't run.
# Vercel only runs `next build`; it never lints, typechecks, or runs the
# test suite. Mirrors this repo's own `pnpm release:verify` sequence
# (package.json) so "green in CI" and "green locally" mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # None of these need to be real for a build/test run: the DuckDB path
      # is a local file the pipeline creates itself, RESEND_API_KEY and the
      # Supabase values are only ever called from a live request (never
      # during build or `pnpm test`, which uses fakes — see
      # auth/workflow.test.ts, runtime/adapters/supabase-persistence-adapter.test.ts).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DUCKDB_PATH: ./database/generated/knowledge.duckdb
      STORIES_STUDIO_ENABLED: "false"
      RESEND_API_KEY: ci-placeholder
      STUDIO_ADMIN_RESET_FROM_EMAIL: onboarding@resend.dev
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` pin here — reads the `packageManager` field in
        # package.json (currently pnpm@10.15.1), so CI and local dev can
        # never drift apart on pnpm version.

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same order as `pnpm release:verify`: the knowledge artifacts must
      # exist before `pnpm build` (Next.js reads the generated snapshot,
      # never rebuilds it automatically — see docs/operations/DEVELOPER-WORKFLOW.md).
      - run: pnpm build:knowledge
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # ADR-004 Phase 3. knowledge.duckdb is WRITTEN by the Python pipeline (backend/pipeline, pinned
  # `duckdb`) and READ by Node (`@duckdb/node-api`, pinned in package.json). This job exercises that
  # exact pair on every run, so a DuckDB storage-format skew (duckdb 2.0.0 already caused one) or a
  # drift between the Python and TypeScript producers fails here, not in production.
  python-artifact:
    runs-on: ubuntu-latest
    env:
      STORIES_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies (pinned by backend/uv.lock)
        working-directory: backend
        run: uv sync --frozen

      - name: Python tests (schemas, kernel port, LadybugDB graph, export, search index, DuckDB pin)
        working-directory: backend
        run: uv run --frozen pytest -v

      - name: Python writes, Node reads (round-trip + real-content artifact + contract fixtures)
        env:
          STORIES_ARTIFACT_PRODUCER: python
        run: >
          pnpm exec vitest run
          build/targets/round-trip.test.ts
          build/targets/python-artifact.test.ts
          fixtures

      - name: TypeScript-built vs Python-built artifact parity
        run: backend/tools/artifact-parity.sh

      - name: Real content parity (build:knowledge under both producers)
        run: pnpm build:knowledge:parity

      # Static checks run last, with the versions pinned in backend/uv.lock (dev dependencies, installed
      # by `uv sync --frozen`) and the configuration in backend/pyproject.toml. They gate the job.
      - name: ruff
        working-directory: backend
        run: uv run --frozen ruff check .

      - name: mypy --strict
        working-directory: backend
        run: uv run --frozen mypy
