[project]
name = "stories-backend"
version = "0.1.0"
description = "Python backend for Stories (ADR-004): Pydantic schema contract, Kernel load pipeline, LadybugDB-backed build pipeline."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    # YAML 1.2 (like js-yaml 3 behind gray-matter): `yes`/`no`/`on`/`off` stay strings.
    "ruamel.yaml>=0.18,<0.19",
    # LadybugDB (PyPI name is `ladybug`, NOT `ladybugdb` / `real-ladybug`). Pinned to the Phase 0
    # spike's version; the working graph is rebuilt every run, so only the Python API matters.
    "ladybug==0.21.2",
    # PINNED TO THE NODE READER, do not bump alone. knowledge.duckdb is written here and read by
    # `@duckdb/node-api` (package.json, pinned 1.5.5-r.1) through ArtifactKnowledgeSourceAdapter.
    # duckdb 2.0.0 wrote a storage format that reader rejected ("database file with version number
    # 999"). The pair is recorded in backend/duckdb-compat.json and enforced by
    # backend/tests/test_duckdb_pin.py and the `python-artifact` CI job.
    "duckdb==1.5.2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Lint and types are enforced on the Studio API port (ADR-004 phase 4); the older Kernel / build
# packages predate this configuration and are not yet held to it.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
